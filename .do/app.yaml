# DigitalOcean App Platform spec for the GrowCentric demo.
# GitHub buildpack deploy (no Docker): App Platform detects the Ruby app,
# installs the bundle and runs assets:precompile automatically.
#
# Before first use:
#   1. Replace YOUR_GITHUB_USER/GrowCentricDemo with the real repo.
#   2. Set SECRET_KEY_BASE in the App Platform dashboard (generate one locally
#      with `bin/rails secret`); same for GROWCENTRIC_DEMO_PASSWORD if you want
#      a different login password than the seed default.
#   3. After the first deploy, set APP_HOST to the URL App Platform assigns
#      (or your custom domain) so Devise mail links render correctly.
#
# Import via: doctl apps create --spec .do/app.yaml
# or paste it in the dashboard under "Create App -> Edit App Spec".

name: growcentric-demo
region: fra

# app.growcentric.ai points at this app. Because the growcentric.ai zone is
# managed in DigitalOcean DNS (zone: below), App Platform creates the CNAME
# record and the Let's Encrypt certificate automatically.
domains:
  - domain: app.growcentric.ai
    type: PRIMARY
    zone: growcentric.ai

services:
  - name: web
    environment_slug: ruby
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/GrowCentricDemo
      branch: main
      deploy_on_push: true
    run_command: bundle exec puma -C config/puma.rb
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /up
      initial_delay_seconds: 30
    envs:
      - key: RAILS_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: RACK_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SECRET_KEY_BASE
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGE_ME_run_bin_rails_secret
      - key: GROWCENTRIC_DEMO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_demo_login_password
      - key: APP_HOST
        scope: RUN_TIME
        value: app.growcentric.ai
      # ---- Tracking ----
      # All optional: an unset platform never loads in the browser and never
      # receives server side events. Client tags load only after cookie
      # consent (except Fathom, which is cookieless).
      #
      # GA4 measurement id, looks like G-XXXXXXXXXX.
      # Where: GA4 -> Admin -> Data streams -> your web stream.
      - key: GA_MEASUREMENT_ID
        scope: RUN_TIME
        value: ""
      # Google Ads conversion id, looks like AW-123456789. Rides on gtag,
      # so it also needs GA_MEASUREMENT_ID.
      # Where: Google Ads -> Tools -> Conversions.
      - key: GOOGLE_ADS_ID
        scope: RUN_TIME
        value: ""
      # LinkedIn Insight Tag partner id, a number like 1234567.
      # Where: Campaign Manager -> Analyze -> Insight Tag -> Manage.
      - key: LINKEDIN_PARTNER_ID
        scope: RUN_TIME
        value: ""
      # Meta Pixel id, a number like 123456789012345. Sets the _fbp and
      # _fbc cookies documented in the cookie policy.
      # Where: Meta Events Manager -> Data sources -> your pixel.
      - key: META_PIXEL_ID
        scope: RUN_TIME
        value: ""
      # Fathom site id, looks like ABCDEFGH. Cookieless, loads without
      # consent. Where: Fathom -> Settings -> Sites.
      - key: FATHOM_SITE_ID
        scope: RUN_TIME
        value: ""
      # ---- Server side tracking APIs ----
      # Used by app/services/analytics.rb via POST /track; events are only
      # forwarded when the visitor's consent cookie says accepted.
      #
      # GA4 Measurement Protocol API secret. Pairs with GA_MEASUREMENT_ID.
      # Where: GA4 -> Admin -> Data streams -> your stream -> Measurement
      # Protocol API secrets -> Create.
      - key: GA4_API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ""
      # Meta Conversions API access token. Pairs with META_PIXEL_ID.
      # Where: Events Manager -> your pixel -> Settings -> Conversions API
      # -> Generate access token.
      - key: META_CAPI_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      # LinkedIn Conversions API OAuth token (scopes r_ads, rw_conversions).
      # LinkedIn only accepts events mapped to a conversion rule; create
      # rules in Campaign Manager and pass their URNs to Analytics.track.
      # Where: LinkedIn Developer portal -> your app -> Auth.
      - key: LINKEDIN_CAPI_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""

# Release phase: App Platform runs PRE_DEPLOY jobs after the build and before
# the new version goes live (DO ignores Heroku-style `release:` Procfile lines).
# db:prepare creates/migrates the schema; the seeds are idempotent and
# date-relative, so every deploy also refreshes the demo data. Remove db:seed
# from the command if you ever want the data left alone.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    environment_slug: ruby
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/GrowCentricDemo
      branch: main
    run_command: bundle exec rails db:prepare db:seed
    instance_size_slug: basic-xs
    envs:
      - key: RAILS_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SECRET_KEY_BASE
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: CHANGE_ME_run_bin_rails_secret
      - key: GROWCENTRIC_DEMO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_demo_login_password

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
